name: CI

on:
  push:
  pull_request:

# A superseded run on the same branch has nothing left to tell us.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Matches the node:20-alpine base image the application ships on.
    strategy:
      matrix:
        node-version: ['20.x']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # better-sqlite3 is a native addon; npm ci compiles it here.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck CLI scripts
        run: npx tsc -p tsconfig.scripts.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Build-time only; the real values come from the environment at runtime.
          SESSION_SECRET: ci-placeholder-secret-not-used-at-runtime
          ADMIN_PASSWORD: ci-placeholder
