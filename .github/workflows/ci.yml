name: CI

on:
  push:
  pull_request:

# A superseded run on the same branch has nothing left to tell us.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    # Matches the node:22-alpine base image the application ships on.
    # better-sqlite3 requires node >=22 and vitest >=22.12, so 20 cannot install.
    strategy:
      matrix:
        node-version: ['22.x']

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      # better-sqlite3 is a native addon; npm ci compiles it here.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck application
        run: npm run typecheck

      - name: Typecheck CLI scripts
        run: npx tsc -p tsconfig.scripts.json --noEmit

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: '1'
          # Build-time only; the real values come from the environment at runtime.
          SESSION_SECRET: ci-placeholder-secret-not-used-at-runtime
          ADMIN_PASSWORD: ci-placeholder

  # The check job says nothing about whether the image builds or the container
  # boots, and those are the two things that fail on deployment day. This job
  # builds the real production image and drives the whole study pipeline
  # through the running container.
  container:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Build the image and smoke test the container
        run: ./scripts/smoke-container.sh

      - name: Container logs on failure
        if: failure()
        run: docker ps -a --filter name=sadi-smoke --format '{{.Names}}' | xargs -r -n1 docker logs --tail 100
