services:
  app:
    build: .
    image: sadi-gonogo:latest
    restart: unless-stopped
    # Only Caddy should reach this. 127.0.0.1 keeps it off the public interface.
    ports:
      - '127.0.0.1:3000:3000'
    environment:
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:?set ADMIN_PASSWORD in .env}
      SESSION_SECRET: ${SESSION_SECRET:?set SESSION_SECRET in .env}
      BASE_URL: ${BASE_URL:-http://localhost:3000}
      DATA_DIR: /data
      # Invitation emails, optional: without them the admin page offers Copy link
      # only. See "Invitation emails" in the README.
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASSWORD:-}
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-}
      SMTP_SECURE: ${SMTP_SECURE:-}
      MAIL_FROM: ${MAIL_FROM:-}
      INVITE_BCC: ${INVITE_BCC:-}
    volumes:
      - sadi-data:/data
    healthcheck:
      test: ['CMD', 'node', '-e', "fetch('http://127.0.0.1:3000/api/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  # A named volume backed by a real directory, so the study data is somewhere
  # you can see, back up and copy off the machine.
  #
  # Locally this is ./data. On the VM, point DATA_HOST_PATH at the mounted
  # persistent disk, e.g. DATA_HOST_PATH=/mnt/disks/sadi-data
  sadi-data:
    driver: local
    driver_opts:
      type: none
      o: bind
      device: ${DATA_HOST_PATH:-${PWD}/data}
